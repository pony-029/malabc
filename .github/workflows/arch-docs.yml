# =============================================================================
# 架构文档快跑门（R12）
# -----------------------------------------------------------------------------
# 为什么单独开一条：`ci.yml` 的 `check_all.py` 是 2 分钟级的大跑，架构图
# 改坏时反馈太慢。这条工作流只做 13 件纯 Python、秒级的事：
#   AD1–AD11 架构文档门 / SVG 哈希清单 / 英文 SVG / 模块图 / 归属表 /
#   版本快照 / 逐图版本记录 / PNG 存在性 / PNG 基线 / 源码证据 / 评审记录 /
#   README 对等 / 行尾。
#
# 它**不需要** archify 或 Node：渲染与英文 SVG 构建在本地完成，
# CI 只验证已提交的产物与清单一致。这样云端不会因为缺少 D:\work\rea\archify 而红。
# =============================================================================
name: arch-docs

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

on:
  push:
    paths:
      - "docs/architecture/**"
      - "tools/check_architecture_docs.py"
      - "tools/export_arch_svg.py"
      - "tools/build_arch_svg_en.py"
      - "tools/build_module_graph.py"
      - "tools/build_ownership_table.py"
      - "tools/snapshot_arch.py"
      - "tools/export_arch_png.py"
      - "tools/apply_arch_sources.py"
      - "tools/record_arch_review.py"
      - "docs/architecture/REVIEWS.md"
      - "docs/ARCHITECTURE_MAP.md"
      - "docs/architecture/SNAPSHOTS.json"
      - "docs/architecture/png_baseline/**"
      - "docs/architecture/VERSIONS.md"
      - ".github/CODEOWNERS"
      - "README.md"
      - "README_CN.md"
  pull_request:
  workflow_dispatch:

jobs:
  arch-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 归属表要 git log 历史



      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Architecture docs gate (AD1–AD11)
        run: python tools/check_architecture_docs.py

      - name: SVG freshness (AD5 manifest)
        run: python tools/export_arch_svg.py --check

      - name: English SVG presence
        run: python tools/build_arch_svg_en.py --check

      - name: Module boundary graph freshness
        run: python tools/build_module_graph.py --check

      - name: Ownership table freshness
        run: python tools/build_ownership_table.py --check

      - name: Snapshot freshness
        run: python tools/snapshot_arch.py --check

      - name: Version record freshness
        run: python tools/build_arch_versions.py --check

      - name: PNG presence
        run: python tools/export_arch_png.py --check

      - name: PNG baseline freshness
        run: python tools/export_arch_png.py --check-baseline

      - name: Architecture review record
        run: python tools/record_arch_review.py --check

      - name: Source evidence presence
        run: python tools/apply_arch_sources.py --check

      - name: README parity (EN/CN)
        run: python tools/check_readme_parity.py

      - name: EOL convention
        run: python tools/check_eol_convention.py
