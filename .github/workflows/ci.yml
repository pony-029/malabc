name: matlabc CI

# ============================================================================
# 只在 **Windows** 上跑（R368）。
#
# 为什么去掉 ubuntu：维护者手上没有 Linux 环境，云端的 ubuntu 失败了也没法
# 在本地复现 —— 那样的红灯只会被忽略，最后变成"点了忽略的检查"。
# 与其两条都不可信，不如把**能本地复现**的那一条做扎实：
# 同样的命令可以在 `E:\ci\matlabc` 里用 `python tools/ci_local.py` 跑一遍。
#
# 恢复 Linux 的代价很小：把 job 的 runs-on 换成矩阵即可
# （`runs-on: ${{ matrix.os }}` + `strategy.matrix.os: [windows-latest, ubuntu-latest]`），
# 前提是那时有人能在 Linux 上复现失败。
#
# 这次改动本身也修了一个真缺陷：`python tests/test_matlabc.py` 此前在
# **任何平台**都会 ModuleNotFoundError（脚本目录进 sys.path，仓库根没进），
# 也就是这条 CI 一直在跑一条必然失败的命令。
# ============================================================================
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python 3.6 syntax gate (P114)
        # matlabc 自身须可被 3.6.5 运行；ast + 正则扫描所有 *.py 检出 3.7+ 语法
        run: python matlabc.py . --check-py36 --max-warnings 0 --json ci_py36.json

      - name: Core regression suite
        # 本机实测：这个套件很长（>400 条），跑满要几十分钟。
        # 给上限，避免一个挂住的用例把整个 job 拖到 GitHub 的 6 小时上限。
        timeout-minutes: 30
        run: python tests/test_matlabc.py

      - name: Static gates (33, each self-proving)
        run: python tools/check_all.py --quiet

      - name: VS Code extension tests
        # 双栏对照的命令注册与函数定位纯函数；不需要真的开 VS Code 窗口。
        run: node vscode/test_extension.js

      - name: C/MATLAB bridge contract
        # 扩展只消费 matlabc/cbridge，这里用真实 LSP 钉住正反向字段。
        run: python -m unittest discover -s tests -p "test_lsp_cbridge.py"

      - name: Behavioural judgements (LSP / MCP)
        run: python tools/lsp_selftest.py --all

      - name: End-to-end scenarios (both protocols)
        run: python tools/rsi_scenarios.py

      - name: Mutation sampling (a judgement that cannot fail is not a judgement)
        run: python tools/mutate_sample.py

      - name: Self analysis showcase
        run: |
          python matlabc.py . -o self_analysis.md --html self_analysis.html `
            --browse --offline --checks all --reproducible

      - name: Upload self-analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-analysis
          path: |
            self_analysis.md
            self_analysis.html
            ci_py36.json
