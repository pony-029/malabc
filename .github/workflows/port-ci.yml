name: matlabc port (MATLAB -> C)

# R433 / P0-R9：MATLAB→C 移植链路的**真编译**门。
#
# 本机没有 gcc/clang/cl 时，`ziglang`（pip 包）提供 `python -m ziglang cc`，
# 因此 Windows 也能真编译；ubuntu 自带 gcc，作为第二编译器交叉验证。
#
# 与 ci.yml 分开：这条链路要装编译器 + 编译 3 个 C 用例，
# 不该把主 CI 的 30 分钟预算再拉长。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  port-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install C compiler (zig; Windows needs it)
        run: python -m pip install --disable-pip-version-check ziglang

      - name: Set up Rust (m2c 发射器)
        uses: dtolnay/rust-toolchain@stable

      # 生成物自带自测（src/selftest.c）：这里用**真实 cmake + ctest** 跑一遍，
      # 而不是只 `gcc` 编译单文件 —— 用户拿到的就是这个工程。
      - name: Rust unit tests (m2c)
        run: cargo test --manifest-path rust/m2c/Cargo.toml

      - name: Generated project: cmake + ctest
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path rust/m2c/Cargo.toml
          python translate/mir.py translate/examples/demo_port.m -o /tmp/demo.mir
          rust/m2c/target/release/m2c build --mir /tmp/demo.mir --out /tmp/gen \
            --name demo \
            --expect translate/examples/demo_port.expected \
            --case "translate/examples/demo_port.fixture=translate/examples/demo_port.expected.args" \
            --case "translate/examples/demo_port.fixture.else=translate/examples/demo_port.expected.else"
          cmake -S /tmp/gen -B /tmp/gen/build -DMLC_RUNTIME="$PWD/c_runtime"
          cmake --build /tmp/gen/build
          ctest --test-dir /tmp/gen/build --output-on-failure

      - name: Port gate (ABI / adapters / operators / fidelity+ledger)
        # --require-c：没有 C 编译器就判红，禁止“跳过编译也算绿”。
        run: python tools/check_translate_port.py --require-c

      - name: Port unit tests
        run: python -m pytest tests/test_translate_port.py -q
