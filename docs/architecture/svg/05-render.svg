<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1066 652" data-layout-contract="readable-v2" role="img" lang="zh-CN" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase"><style type="text/css"><![CDATA[
:root,
    [data-theme="dark"]{
      --bg: #020617;
      --grid: #1e293b;
      --canvas-dot: rgba(148, 163, 184, 0.16);
      --text: #ffffff;
      --text-muted: #94a3b8;
      --text-dim: #475569;
      
      --text-faint: #7d8da1;

      --panel: rgba(15, 23, 42, 0.5);
      --panel-border: #1e293b;
      --lane-fill: rgba(15, 23, 42, 0.22);
      --lane-stroke: #334155;

      --arrow: #64748b;
      --arrow-emphasis: #34d399;

      
      --mask: #0f172a;

      --frontend-fill:    rgba(8, 51, 68, 0.4);
      --frontend-stroke:  #22d3ee;
      --backend-fill:     rgba(6, 78, 59, 0.4);
      --backend-stroke:   #34d399;
      --database-fill:    rgba(76, 29, 149, 0.4);
      --database-stroke:  #a78bfa;
      --cloud-fill:       rgba(120, 53, 15, 0.3);
      --cloud-stroke:     #fbbf24;
      --security-fill:    rgba(136, 19, 55, 0.4);
      --security-stroke:  #fb7185;
      --messagebus-fill:  rgba(251, 146, 60, 0.3);
      --messagebus-stroke:#fb923c;
      --external-fill:    rgba(30, 41, 59, 0.5);
      --external-stroke:  #94a3b8;

      --toolbar-bg:       rgba(15, 23, 42, 0.8);
      --toolbar-border:   #334155;
      --toolbar-text:     #e2e8f0;
      --toolbar-hover:    rgba(15, 23, 42, 0.95);
      --toolbar-menu-bg:  #0f172a;
    }
body{
      --archify-page-top: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      min-height: 100vh;
      padding: var(--archify-page-top) 2rem 2rem;
      color: var(--text);
      
    }
svg{
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', 'Noto Sans Mono CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', monospace;
      width: 100%;
      min-width: min(900px, 100%);
      display: block;
      transform-origin: 0 0;
      transition: transform 0.18s ease;
    }
.c-grid{ stroke: var(--grid); fill: none; }
.c-mask{ fill: var(--mask); stroke: none; }
.c-lane-rule{ stroke: var(--lane-stroke); fill: none; opacity: 0.7; }
.c-lane-wash{ fill: var(--lane-fill); stroke: none; }
.c-backend{ fill: var(--backend-fill);    stroke: var(--backend-stroke); }
.c-security{ fill: var(--security-fill);   stroke: var(--security-stroke); }
.t-primary{ fill: var(--text); }
.t-muted{ fill: var(--text-muted); }
.t-dim{ fill: var(--text-dim); }
html[data-preset="classic"] .diagram-container > svg .c-grid{ stroke: transparent; }
html[data-preset="classic"][data-theme="light"] .diagram-container > svg [data-node-id] > rect:not(.c-mask){
      filter: drop-shadow(0 1px 1px rgba(17, 24, 39, 0.05)) drop-shadow(0 6px 12px rgba(17, 24, 39, 0.06));
    }
html[data-preset="classic"][data-theme="dark"] .diagram-container > svg [data-node-id] > rect:not(.c-mask){
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.35));
    }
html[data-preset="classic"] .diagram-container > svg .c-lane-wash{ fill: color-mix(in srgb, var(--text) 2.6%, transparent); }
html[data-preset="classic"] .diagram-container > svg .c-lane-rule{ stroke: var(--panel-border); opacity: 1; }
html[data-preset="classic"][data-theme="dark"] .diagram-container > svg .c-lane-rule{ stroke: rgba(148, 163, 184, 0.16); }
svg .semantic-sigil{
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.76;
      pointer-events: none;
    }
svg .semantic-sigil > *{ vector-effect: non-scaling-stroke; }
svg .semantic-sigil .sigil-fill{ fill: currentColor; stroke: none; }
svg .s-backend{ color: var(--backend-stroke); }
svg .s-security{ color: var(--security-stroke); }
.a-default{ stroke: var(--arrow); fill: none; }
.m-default{ fill: var(--arrow); }
.m-emphasis{ fill: var(--arrow-emphasis); }
.m-security{ fill: var(--security-stroke); }
.m-dashed{ fill: var(--database-stroke); }
svg [data-node-id] > .c-mask{ fill-opacity: 1; }
svg[data-preset="editorial"] .c-grid{
      stroke-dasharray: 1 4;
      opacity: 0.48;
    }
svg[data-preset="blueprint"] .c-grid{
      stroke-dasharray: 1 3;
      opacity: 0.78;
    }
svg[data-preset="blueprint"] .c-security-group,
    svg[data-preset="blueprint"] .c-lane{ stroke-dasharray: 7 3; }
.c-security-group{ fill: transparent; stroke: var(--security-stroke); stroke-dasharray: 4,4; }
.c-lane{ fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-dasharray: 6,6; }
]]></style>
